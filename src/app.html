<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script type="module">
      try {
        import.meta.url;
        import("_").catch(() => 1);
      } catch (e) {}
      window.__KIT_is_modern_browser = true;
      window.__KIT_modern_import_func = (path) => import(path);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var s = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var v = t ? t : s ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", v);

          // Anti-flash: set background immediately if determinstic
          if (v === "dark") {
            document.documentElement.style.backgroundColor = "#2c302e"; // --color-bg dark
            document.documentElement.style.color = "#e2e8f0"; // --color-text dark
          }
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
